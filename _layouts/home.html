---
layout: default
---

<div class="academic-shell">
  <div class="academic-grid">
    <aside class="academic-sidebar sticky" aria-label="Profile">
      <img class="profile-photo" src="{{ '/assets/images/google-site-image-1.jpg' | relative_url }}" alt="Tzu-Ting Yang">
      <h2 class="sidebar-name">{{ site.author.name }}</h2>
      <p class="sidebar-name-zh">{{ site.author.name_zh }}</p>

      <ul class="profile-links">
        <li><span class="profile-icon" aria-hidden="true">●</span>{{ site.author.location }}</li>
        <li><span class="profile-icon" aria-hidden="true">◆</span>{{ site.author.affiliation }}</li>
        <li><span class="profile-icon" aria-hidden="true">@</span><a href="mailto:{{ site.author.email }}">{{ site.author.email }}</a></li>
        <li><span class="profile-icon" aria-hidden="true">CV</span><a href="{{ site.author.cv | relative_url }}">Curriculum Vitae</a></li>
      </ul>
    </aside>

    <article class="academic-main prose">
      <h1 class="page-title">{{ page.title }}</h1>
      {{ content }}
    </article>
  </div>
</div>
